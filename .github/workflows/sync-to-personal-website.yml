name: Sync to personal-website

on:
  push:
    branches: [main]
    paths:
      - silver-thesis-key-milestones.html

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Push HTML to personal-website repo
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:siddharthasd/personal-website.git _target
          cp silver-thesis-key-milestones.html _target/
          # Ensure index.html exists (required by Azure Static Web Apps)
          if [ ! -f _target/index.html ]; then
            printf '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta http-equiv="refresh" content="0; url=silver-thesis-key-milestones.html">\n<title>Redirecting...</title>\n</head>\n<body>\n<p><a href="silver-thesis-key-milestones.html">Silver Thesis Dashboard</a></p>\n</body>\n</html>\n' > _target/index.html
            cd _target
            git add index.html silver-thesis-key-milestones.html
          else
            cd _target
            git add silver-thesis-key-milestones.html
          fi
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "sync: update silver-thesis-key-milestones.html"
          git push
